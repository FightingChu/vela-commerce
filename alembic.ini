# alembic 配置。
#
# sqlalchemy.url 留空是故意的:所有环境的连接串走 VELA_DB_URL 环境变量,
# env.py 负责读。别把密码提交进来——去年 git 历史清洗的事还历历在目。
#
# 用法:
#   VELA_DB_URL=postgresql://... alembic upgrade head
#   VELA_DB_URL=postgresql://... alembic revision --autogenerate -m "xxx"

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
# 时区统一 UTC,和 vela.config.clocks.utc_now 对齐
timezone = UTC

# 留空:实际连接串由 env.py 从 VELA_DB_URL 读取
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
