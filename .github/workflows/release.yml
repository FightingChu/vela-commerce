# 发布:打 tag 触发,构建镜像推 registry。
#
# 注:registry 段全部是占位(真实镜像仓库域名/凭证由运维在
# GitHub Environments 里配),pipeline 骨架先合入,等权限开通
# 后把 VELA_REGISTRY secret 一配即通。Jenkins 老发布 job 过渡期
# 仍可用,但不再维护。

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (smoke check before shipping)
        run: pip install -e ".[dev]" && pytest

      - name: Docker meta
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=${VELA_REGISTRY:-registry.example.com}/vela-commerce" >> "$GITHUB_OUTPUT"

      - name: Login to registry (placeholder)
        run: echo "TODO: docker login ${{ steps.meta.outputs.image }} —— 等 registry 凭证下发"

      - name: Build
        run: docker build -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} .

      - name: Push (placeholder)
        run: echo "TODO: docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
