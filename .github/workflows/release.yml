# 发布:打 tag 触发,构建镜像推 registry。
#
# 注:registry 域名与凭证在 GitHub Environments → production 里配
# (VELA_REGISTRY secret),由运维持有。

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (smoke check before shipping)
        run: pip install -e ".[dev]" && pytest

      - name: Docker meta
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=${VELA_REGISTRY:-registry.internal/vela}/vela-commerce" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        run: docker login "${{ steps.meta.outputs.image }}" -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build
        run: docker build -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} .

      - name: Push
        run: docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
