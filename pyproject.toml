[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vela-commerce"
version = "1.4.0"
description = "Vela Retail 电商中台:订单 / 库存 / 价格 / 促销 / 结算 / 对账"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Vela Retail Platform Team" }]
dependencies = [
    "Flask>=3.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vela_commerce.egg-info", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import 排序
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
    "FURB" # refurb
]
ignore = [
    "UP031",  # 存量 % 格式化保持原样,不做全量改写
    "RUF003", # 中文注释允许全角标点
]

[tool.ruff.lint.per-file-ignores]
"vela/legacy/*" = [
    "E722",   # v1 冻结代码,裸 except 是既有行为,等整体下线一起清
    "SIM105", # 同上
    "SIM115", # 老式 open/close 手工管理,保持原样
    "F841",   # 冻结壳里的死变量,别动
]

[tool.ruff.lint.isort]
known-first-party = ["vela"]

[tool.setuptools.packages.find]
include = ["vela*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
